AdminLoginRequest:
  type: object
  required: [login, password]
  additionalProperties: false
  properties:
    login:
      type: string
      minLength: 1
      maxLength: 100
    password:
      type: string
      minLength: 1
      maxLength: 255
      writeOnly: true

AdminRefreshRequest:
  type: object
  required: [refreshToken]
  additionalProperties: false
  properties:
    refreshToken:
      type: string
      minLength: 1

AdminAuthTokens:
  type: object
  required: [accessToken, refreshToken, tokenType, expiresIn]
  properties:
    accessToken:
      type: string
    refreshToken:
      type: string
    tokenType:
      type: string
      enum: [Bearer]
    expiresIn:
      type: integer
      description: Срок access-токена в секундах
    admin:
      type: object
      required: [id, login, role]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        role:
          type: string
          enum: [ADMIN]
        displayName:
          type: string
          nullable: true
