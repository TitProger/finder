login:
  post:
    operationId: adminLogin
    tags: [auth]
    summary: Вход админа
    description: >
      Публичный эндпоинт. Учётка засеяна в БД. Пароль в ответе не возвращается.
      Ошибки 401: INVALID_CREDENTIALS, USER_INACTIVE.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth/auth.yaml#/AdminLoginRequest'
    responses:
      '200':
        description: Токены админа
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/auth/auth.yaml#/AdminAuthTokens'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'

refresh:
  post:
    operationId: adminRefresh
    tags: [auth]
    summary: Обновить access-токен админа
    description: >
      Публичный эндпоинт. Принимает refreshToken в теле.
      Ошибка 401: INVALID_REFRESH_TOKEN.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth/auth.yaml#/AdminRefreshRequest'
    responses:
      '200':
        description: Новые токены
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/common.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../components/schemas/auth/auth.yaml#/AdminAuthTokens'
      '400':
        $ref: '../../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/responses/errors.yaml#/Unauthorized'
      '500':
        $ref: '../../components/responses/errors.yaml#/InternalError'
