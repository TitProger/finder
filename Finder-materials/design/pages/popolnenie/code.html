<script data-purpose="tariff-selection-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const tariffCards = document.querySelectorAll('.tariff-card');
      const summaryTariffLabel = document.getElementById('summary-tariff-label');
      const summaryCreditsValue = document.getElementById('summary-credits-value');
      const primaryPayButton = document.getElementById('pay-primary-button');
      const summaryUsdValue = document.getElementById('summary-usd-value');

      // Update right column state upon selecting a tariff
      tariffCards.forEach((card) => {
        card.addEventListener('click', () => {
          // Deselect all
          tariffCards.forEach((item) => {
            item.classList.remove('active', 'border-2', 'border-black');
            item.classList.add('border', 'border-gray-200');
            const radio = item.querySelector('.radio-circle');
            if (radio) {
              radio.className = 'radio-circle w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center text-transparent';
            }
            const input = item.querySelector('input[type="radio"]');
            if (input) input.checked = false;
          });

          // Activate clicked item
          card.classList.add('active', 'border-2', 'border-black');
          card.classList.remove('border-gray-200');
          const activeRadio = card.querySelector('.radio-circle');
          if (activeRadio) {
            activeRadio.className = 'radio-circle w-5 h-5 rounded-full bg-black text-white flex items-center justify-center';
          }
          const activeInput = card.querySelector('input[type="radio"]');
          if (activeInput) activeInput.checked = true;

          // Retrieve dataset values
          const name = card.getAttribute('data-tariff-name');
          const credits = card.getAttribute('data-tariff-credits');
          const rub = card.getAttribute('data-tariff-rub');
          const usd = card.getAttribute('data-tariff-usd');

          // Update Summary Card
          summaryTariffLabel.textContent = `Тариф «${name}»`;
          summaryCreditsValue.textContent = credits;
          primaryPayButton.textContent = `Оплатить ${rub} ₽`;
          summaryUsdValue.textContent = `$${usd}`;
        });
      });
    });
  </script>
