name: finder

services:
  postgres:
    image: postgres:17
    container_name: finder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-finder}
      POSTGRES_USER: ${PG_USERNAME:-finder}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-finder}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-finder} -d ${PG_DATABASE:-finder}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finder-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      PG_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-finder}
      PG_USERNAME: ${PG_USERNAME:-finder}
      PG_PASSWORD: ${PG_PASSWORD:-finder}
      PG_MIGRATIONS_RUN: "true"
      PG_LOGGING: "false"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:?ADMIN_TELEGRAM_IDS is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FREE_PLAN_DAILY_LIMIT: ${FREE_PLAN_DAILY_LIMIT:-3}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
