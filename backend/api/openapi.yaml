          type: string
          minLength: 1
          maxLength: 512
          description: Имя товара. Обязательно, когда своего товара ещё нет ни в запросе, ни в оффере.
        nameZh:
          type: string
          maxLength: 512
          nullable: true
        qtyMin:
          type: number
          minimum: 0
        qtyMax:
          type: number
          minimum: 0
        quantityQuestionId:
          type: string
          format: uuid
        productAttributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
        isLive:
          type: boolean
