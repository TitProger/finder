      enum:
        - TEXT
        - NUMBER
        - BOOLEAN
        - SINGLE_CHOICE
        - MULTI_CHOICE
    SiteRole:
      type: string
      enum:
        - FACTORY_CONTACT
        - CHINA_OPEN_PRICE
        - RUSSIA_RETAIL
        - RUSSIA_WHOLESALE
    Category:
