openapi: 3.1.0
info:
  title: Finder API
  version: 0.4.0
  description: |
    Контракт API Finder. Источник правды — этот репозиторий (git tag).
servers:
  - url: http://localhost:8090
    description: local
tags:
  - name: health
    description: Проверка работоспособности
  - name: auth
    description: Вход админа (JWT)
  - name: categories
    description: Справочник категорий для админа
  - name: inquiries
    description: Заявка клиента и назначение категории админом
  - name: optimal-cards
    description: Оптимальная карточка, которую админ помечает живой
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: Проверка работоспособности сервиса
      security: []
      responses:
        '200':
          description: Сервис доступен
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
  /admin/login:
    post:
      operationId: adminLogin
      tags:
        - auth
      summary: Вход админа
      description: |
        Публичный эндпоинт. Учётка засеяна в БД. Пароль в ответе не возвращается. Ошибки 401: INVALID_CREDENTIALS, USER_INACTIVE.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Токены админа
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/refresh:
    post:
      operationId: adminRefresh
      tags:
        - auth
      summary: Обновить access-токен админа
      description: |
        Публичный эндпоинт. Принимает refreshToken в теле. Ошибка 401: INVALID_REFRESH_TOKEN.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefreshRequest'
      responses:
        '200':
          description: Новые токены
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories:
    post:
      operationId: createCategory
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Создать категорию
      description: Только ADMIN. Без фраз, вопросов и площадок — их добавляют отдельными ручками.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Созданная категория
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{id}:
    get:
      operationId: getCategoryById
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Категория с фразами, пакетами, вопросами и площадками
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Категория целиком
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateCategory
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Править категорию
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Обновлённая категория
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/phrases:
    post:
      operationId: createCategoryPhrase
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Добавить фразу категории
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryPhraseRequest'
      responses:
        '200':
          description: Фраза
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryPhrase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/phrases/{id}:
    patch:
      operationId: updateCategoryPhrase
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Править фразу
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryPhraseRequest'
      responses:
        '200':
          description: Фраза
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryPhrase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/question-packs:
    post:
      operationId: createQuestionPack
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Добавить пакет вопросов
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionPackRequest'
      responses:
        '200':
          description: Пакет
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuestionPack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/question-packs/{id}:
    patch:
      operationId: updateQuestionPack
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Править пакет вопросов
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionPackRequest'
      responses:
        '200':
          description: Пакет
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuestionPack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/questions:
    post:
      operationId: createCategoryQuestion
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Добавить вопрос категории или пакета
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryQuestionRequest'
      responses:
        '200':
          description: Вопрос
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/questions/{id}:
    patch:
      operationId: updateCategoryQuestion
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Править вопрос
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryQuestionRequest'
      responses:
        '200':
          description: Вопрос
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/sites:
    post:
      operationId: createCategorySite
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Добавить площадку категории
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategorySiteRequest'
      responses:
        '200':
          description: Площадка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategorySite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories/{categoryId}/sites/{id}:
    patch:
      operationId: updateCategorySite
      security:
        - bearerAuth: []
      tags:
        - categories
      summary: Править площадку
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategorySiteRequest'
      responses:
        '200':
          description: Площадка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategorySite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /inquiries:
    post:
      operationId: createInquiry
      tags:
        - inquiries
      summary: Создать заявку текстом
      description: |
        Без JWT. Клиент определяется telegram user id — это вход, не регистрация. Точная фраза активной категории пишет category_id и отдаёт вопросы этой категории и одного пакета, если текст точно совпал с его code или title. Иначе заявка на паузе, category_id пустой, research_run не создаётся. Telegram-бот и парсеры не вызываются.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
      responses:
        '200':
          description: Заявка после классификации
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Inquiry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /inquiries/{id}:
    get:
      operationId: getInquiryById
      tags:
        - inquiries
      summary: Прочитать заявку
      description: |
        Без JWT. Идентификатор заявки — uuid. На паузе questions пустой. После категории — вопросы базы и выбранного пакета. Если обязательные ответы совпали с живой карточкой, статус SERVED_FROM_DATABASE и в ответе сама карточка. Иначе карточка пустая. research_run не создаётся.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Inquiry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inquiries/{id}/assign-category:
    post:
      operationId: assignInquiryCategory
      tags:
        - inquiries
      summary: Назначить категорию
      description: |
        Только ADMIN. Снимает паузу, пишет category_id и дописывает фразу клиента в category_phrase. Повтор той же фразы в категории ошибкой не считается. Вектор фразы не заполняется. research_run не создаётся.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCategoryRequest'
      responses:
        '200':
          description: Заявка после назначения
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Inquiry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inquiries/{id}/assign-new-category:
    post:
      operationId: createCategoryAndAssignInquiry
      tags:
        - inquiries
      summary: Создать категорию и назначить
      description: |
        Только ADMIN. Создаёт активную категорию, назначает её заявке и дописывает фразу клиента. Пауза снимается. research_run не создаётся. Эмбеддинг категории не пишется.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryAndAssignRequest'
      responses:
        '200':
          description: Заявка после новой категории
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Inquiry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/optimal-cards:
    post:
      operationId: createOptimalCard
      tags:
        - optimal-cards
      summary: Создать оптимальную карточку
      description: |
        Только ADMIN. Карточка создаётся вручную или из оффера, если передан offerId. Оффер уже должен быть в базе: парсеры и research_run этот вызов не запускает. Флаг isLive по умолчанию выключен. Включение снимает флаг с другой живой строки того же товара и того же диапазона количества. Снятая строка остаётся.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptimalCardRequest'
      responses:
        '200':
          description: Созданная карточка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OptimalCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/optimal-cards/{id}:
    get:
      operationId: getOptimalCardById
      tags:
        - optimal-cards
      summary: Прочитать оптимальную карточку
      description: Только ADMIN. Отдаёт и живую, и снятую строку.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OptimalCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateOptimalCard
      tags:
        - optimal-cards
      summary: Править оптимальную карточку
      description: |
        Только ADMIN. Меняет переданные поля. Повторное isLive=true на тот же товар и тот же диапазон снимает флаг с предыдущей строки, саму строку не удаляет. research_run не создаётся.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOptimalCardRequest'
      responses:
        '200':
          description: Карточка после правки
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OptimalCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiStatus:
      type: string
      enum:
        - success
        - error
    PageInfo:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ApiError:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        code:
          oneOf:
            - type: string
            - type: integer
        context: {}
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ApiResponse:
      type: object
      required:
        - status
        - message
        - data
      description: |
