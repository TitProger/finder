    Inquiry:
      type: object
      required:
        - id
        - clientUserId
        - telegramUserId
        - status
        - rawText
        - photoUrls
        - categoryId
        - questionPackId
        - isPaused
        - pauseReason
        - assignedByUserId
        - classificationScores
        - questions
        - optimalCardId
        - optimalCard
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        clientUserId:
          type: string
          format: uuid
        telegramUserId:
          type: integer
          minimum: 1
          description: Telegram user id клиента. Вход, не отдельная регистрация.
        status:
          $ref: '#/components/schemas/InquiryStatus'
        rawText:
          type: string
          description: Текст клиента. При назначении категории эта фраза дописывается в category_phrase.
        photoUrls:
          type: array
          items:
            type: string
          description: |
            Telegram file_id фото, которое клиент приложил к тексту. Пустой массив, если фото нет. POST /inquiries фото не принимает. Бот пишет file_id сюда и пересылает фото админу. Это не публичная ссылка.
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: null, пока классификатор сомневается или фраза неоднозначна.
        questionPackId:
          type: string
          format: uuid
          nullable: true
          description: |
            Один подходящий пакет. null — только базовые вопросы категории. Пакет выбирается точным совпадением текста с code или title. Сомнение между пакетами паузу не ставит.
        isPaused:
          type: boolean
          description: true — ресерч не стартует. research_run не создаётся.
        pauseReason:
          type: string
          nullable: true
        assignedByUserId:
          type: string
          format: uuid
          nullable: true
          description: Админ, который назначил категорию вручную. null, если категорию выбрала точная фраза.
        classificationScores:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassificationScores'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/InquiryQuestion'
          description: |
            Пусто на паузе. Иначе базовые вопросы категории и вопросы выбранного пакета. Вопросы других пакетов не отдаются.
        optimalCardId:
          type: string
          format: uuid
          nullable: true
          description: |
            Живая карточка, которую отдали из базы. null, пока ответов не хватает или подходящей живой карточки нет. research_run при этом не создаётся.
        optimalCard:
          nullable: true
          description: |
            Та же карточка целиком. Пусто, если заявка ещё не в статусе «ответ из базы».
          allOf:
            - $ref: '#/components/schemas/OptimalCard'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CreateInquiryRequest:
      type: object
      required:
