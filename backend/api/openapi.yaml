      type: string
      description: |
        exact_phrase — одна активная категория по точной фразе, паузы нет. ambiguous_phrase — та же фраза в нескольких категориях, пауза. embedder_stub — точной фразы нет, заглушка эмбеддинга категорию не выбирает. vector_unresolved — вектор посчитан, порог модели ещё не задан, пауза.
      enum:
        - exact_phrase
        - ambiguous_phrase
        - embedder_stub
        - vector_unresolved
