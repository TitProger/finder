    UpdateQuestionPackRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
        isActive:
          type: boolean
    CreateCategoryQuestionRequest:
      type: object
