        prompt:
          type: string
          minLength: 1
        answerType:
          $ref: '#/components/schemas/QuestionAnswerType'
        choices:
          description: Варианты ответа; иначе null
          oneOf:
            - type: object
            - type: array
            - type: 'null'
        isRequired:
          type: boolean
        sortOrder:
          type: integer
    UpdateCategoryQuestionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        questionPackId:
          type: string
          format: uuid
          nullable: true
        prompt:
          type: string
          minLength: 1
        answerType:
          $ref: '#/components/schemas/QuestionAnswerType'
        choices:
          description: Варианты ответа; иначе null
          oneOf:
            - type: object
            - type: array
            - type: 'null'
        isRequired:
          type: boolean
        sortOrder:
          type: integer
    CreateCategorySiteRequest:
      type: object
      required:
        - siteRole
        - name
      additionalProperties: false
      properties:
        siteRole:
          $ref: '#/components/schemas/SiteRole'
        name:
          type: string
          minLength: 1
          maxLength: 255
        baseUrl:
          type: string
          nullable: true
          maxLength: 2048
        priority:
          type: integer
        requiresLogin:
          type: boolean
        queryTemplate:
          type: string
          nullable: true
        excludeNote:
          type: string
          nullable: true
        isActive:
          type: boolean
    UpdateCategorySiteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        siteRole:
          $ref: '#/components/schemas/SiteRole'
        name:
          type: string
          minLength: 1
          maxLength: 255
        baseUrl:
          type: string
          nullable: true
          maxLength: 2048
        priority:
          type: integer
        requiresLogin:
          type: boolean
        queryTemplate:
          type: string
          nullable: true
        excludeNote:
          type: string
          nullable: true
        isActive:
          type: boolean
    InquiryStatus:
      type: string
      enum:
        - DRAFT
        - AWAITING_CATEGORY
        - COLLECTING_ANSWERS
        - SERVED_FROM_DATABASE
        - RESEARCHING
        - DOSSIER_WITH_ADMIN
        - LIMIT_EXCEEDED
        - CLOSED
    ClassificationMatch:
      type: string
      description: |
        Чем кандидат попал в оценку. exact_phrase — точное совпадение фразы. keyword — совпадение по ключевым словам. llm — классификация через LLM. vector — векторное сходство.
      enum:
        - exact_phrase
        - keyword
        - llm
        - vector
    ClassificationOutcome:
      type: string
      description: |
        exact_phrase — одна активная категория по точной фразе. keyword_match — совпадение по ключевым словам. llm_confident — LLM уверенно выбрала категорию. ambiguous_phrase — та же фраза в нескольких категориях. ambiguous_keyword — ключевые слова совпали с несколькими категориями. llm_low_confidence — LLM не уверена в выборе. embedder_stub — заглушка эмбеддинга. vector_unresolved — вектор не выбирает категорию.
      enum:
        - exact_phrase
        - keyword_match
        - llm_confident
        - ambiguous_phrase
        - ambiguous_keyword
        - llm_low_confidence
        - embedder_stub
        - vector_unresolved
    ClassificationCandidate:
      type: object
      required:
        - categoryId
        - categoryName
        - score
        - matchedBy
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        score:
          type: number
          description: 1 у точной фразы. У вектора — косинус, без порога назначения.
        matchedBy:
          $ref: '#/components/schemas/ClassificationMatch'
    ClassificationScores:
      type: object
      required:
        - outcome
        - stub
        - candidates
      properties:
        outcome:
          $ref: '#/components/schemas/ClassificationOutcome'
        stub:
          type: boolean
          description: true, если на этом проходе эмбеддинг был заглушкой.
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ClassificationCandidate'
    InquiryQuestion:
      type: object
      required:
        - id
        - categoryId
        - prompt
        - answerType
        - isRequired
        - sortOrder
        - createdAt
      description: Вопрос, который надо задать клиенту. База категории и, если выбран, один пакет.
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        questionPackId:
          type: string
          format: uuid
          nullable: true
          description: null — базовый вопрос категории
        prompt:
          type: string
        answerType:
          $ref: '#/components/schemas/QuestionAnswerType'
        choices:
          description: Варианты для SINGLE_CHOICE / MULTI_CHOICE; иначе null
          oneOf:
            - type: object
            - type: array
            - type: 'null'
        isRequired:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    Inquiry:
      type: object
      required:
        - id
        - clientUserId
        - telegramUserId
        - status
        - rawText
        - photoUrls
        - categoryId
        - questionPackId
        - isPaused
        - pauseReason
        - assignedByUserId
        - classificationScores
        - questions
        - optimalCardId
        - optimalCard
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        clientUserId:
          type: string
          format: uuid
        telegramUserId:
          type: integer
          minimum: 1
          description: Telegram user id клиента. Вход, не отдельная регистрация.
        status:
          $ref: '#/components/schemas/InquiryStatus'
        rawText:
          type: string
          description: Текст клиента. При назначении категории эта фраза дописывается в category_phrase.
        photoUrls:
          type: array
          items:
            type: string
          description: |
            Telegram file_id фото, которое клиент приложил к тексту. Пустой массив, если фото нет. POST /inquiries фото не принимает. Бот пишет file_id сюда и пересылает фото админу. Это не публичная ссылка.
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: null, пока классификатор сомневается или фраза неоднозначна.
        questionPackId:
          type: string
          format: uuid
          nullable: true
          description: |
            Один подходящий пакет. null — только базовые вопросы категории. Пакет выбирается точным совпадением текста с code или title. Сомнение между пакетами паузу не ставит.
        isPaused:
          type: boolean
          description: true — ресерч не стартует. research_run не создаётся.
        pauseReason:
          type: string
          nullable: true
        assignedByUserId:
          type: string
          format: uuid
          nullable: true
          description: Админ, который назначил категорию вручную. null, если категорию выбрала точная фраза.
        classificationScores:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassificationScores'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/InquiryQuestion'
          description: |
            Пусто на паузе. Иначе базовые вопросы категории и вопросы выбранного пакета. Вопросы других пакетов не отдаются.
        optimalCardId:
          type: string
          format: uuid
          nullable: true
          description: |
            Живая карточка, которую отдали из базы. null, пока ответов не хватает или подходящей живой карточки нет. research_run при этом не создаётся.
        optimalCard:
          nullable: true
          description: |
            Та же карточка целиком. Пусто, если заявка ещё не в статусе «ответ из базы».
          allOf:
            - $ref: '#/components/schemas/OptimalCard'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CreateInquiryRequest:
      type: object
      required:
        - telegramUserId
        - text
      additionalProperties: false
      properties:
        telegramUserId:
          type: integer
          minimum: 1
          description: Telegram user id. Если клиента ещё нет, создаётся роль CLIENT.
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Свободный текст заявки.
    AssignCategoryRequest:
      type: object
      required:
        - categoryId
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          description: Активная категория. Фраза клиента дописывается в неё.
    CreateCategoryAndAssignRequest:
      type: object
      required:
        - name
        - description
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          description: Текст категории для будущего эмбеддинга. Цену не класть. Вектор на этом этапе не пишем.
    ResearchRerunResult:
      type: object
      required:
        - inquiryId
        - runId
        - inquiryStatus
        - runStatus
      additionalProperties: false
      properties:
        inquiryId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        inquiryStatus:
          $ref: '#/components/schemas/InquiryStatus'
        runStatus:
          type: string
          enum:
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - FAILED_TO_START
            - STALE
            - CANCELLED
    SaveInquiryEconomicsRequest:
      type: object
      additionalProperties: false
      required:
        - deliveryPerUnit
        - dutyPercent
        - markupPercent
      properties:
        deliveryPerUnit:
          type: number
          minimum: 0
          description: Доставка за одну единицу, в рублях.
        dutyPercent:
          type: number
          minimum: 0
          maximum: 1000
          description: Пошлина в процентах от цены товара.
        otherCost:
          type: number
          minimum: 0
          description: Прочие затраты за единицу, в рублях. Пусто значит 0.
        markupPercent:
          type: number
          minimum: 0
          maximum: 1000
          description: Наценка в процентах после доставки, пошлины и прочих.
    InquiryEconomics:
      type: object
      additionalProperties: false
      required:
        - inquiryId
        - quotes
        - fxFallback
        - economics
        - landed
      properties:
        inquiryId:
          type: string
          format: uuid
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/LayerQuote'
        fxFallback:
          type: boolean
          description: true, если хотя бы один слой взял запасной курс.
        economics:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SaveInquiryEconomicsRequest'
        landed:
          type: array
          description: Пустой, пока менеджер не ввёл затраты или нет заводской цены.
          items:
            $ref: '#/components/schemas/LandedUnit'
    ContactChannel:
      type: string
      description: Канал контакта на оптимальной карточке.
      enum:
        - PHONE
        - EMAIL
        - WECHAT
        - TELEGRAM
        - OTHER
    AttributeValue:
      description: Значение обязательного ответа, как его хранит заявка.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            type: string
    OptimalCard:
      type: object
      required:
        - id
        - categoryId
        - canonicalProductId
        - nameRu
        - nameZh
        - qtyMin
        - qtyMax
        - quantityQuestionId
        - isLive
        - offerId
        - companyId
        - storefrontId
        - price
        - currency
        - contactValue
        - contactChannel
        - contactUrl
        - contactAdminEntered
        - contactEnteredAt
        - productAttributes
        - reasonNote
        - markedLiveByUserId
        - markedLiveAt
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        canonicalProductId:
          type: string
          format: uuid
          description: Товар карточки. Повторная живая снимает флаг у другой строки с тем же товаром и тем же диапазоном.
        nameRu:
          type: string
        nameZh:
          type: string
          nullable: true
        qtyMin:
          type: number
          minimum: 0
          description: Нижняя граница количества, включительно.
        qtyMax:
          type: number
          minimum: 0
          description: Верхняя граница количества, включительно.
        quantityQuestionId:
          type: string
          format: uuid
          description: Обязательный вопрос типа NUMBER. Его число должно попасть в диапазон.
        isLive:
          type: boolean
          description: Живая карточка. На один товар и один диапазон живая только одна. Снятая строка остаётся.
        offerId:
          type: string
          format: uuid
          nullable: true
          description: Оффер, из которого собрали карточку. Пусто, если админ вписал её вручную.
        companyId:
          type: string
          format: uuid
          nullable: true
        storefrontId:
          type: string
          format: uuid
          nullable: true
        price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          nullable: true
          description: Трёхбуквенный код валюты, если цена есть.
        contactValue:
          type: string
          nullable: true
        contactChannel:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ContactChannel'
        contactUrl:
          type: string
          nullable: true
          description: Страница контакта. Пусто, если контакт вписан админом.
        contactAdminEntered:
          type: boolean
          description: true — контакт вписан админом, без url.
        contactEnteredAt:
          type: string
          format: date-time
          nullable: true
        productAttributes:
          type: object
          description: |
            Обязательные ответы кроме объёма. Ключ — id вопроса. Набор ключей должен совпасть с обязательными ответами заявки, кроме вопроса объёма.
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
        reasonNote:
          type: string
          nullable: true
        markedLiveByUserId:
          type: string
          format: uuid
          nullable: true
        markedLiveAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Пока эта дата в будущем, карточку можно отдать из базы. Если срок не задан при создании — 30 дней.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CreateOptimalCardRequest:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - qtyMin
        - qtyMax
        - quantityQuestionId
        - productAttributes
      properties:
        categoryId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Если задан, карточка собирается из оффера: цена, валюта, компания, витрина и url страницы. Явно переданные поля заменяют снятые с оффера. Парсер не вызывается.
        canonicalProductId:
          type: string
          format: uuid
          nullable: true
          description: Уже существующий товар этой категории. Иначе товар создаётся из nameRu.
        nameRu:
          type: string
          minLength: 1
          maxLength: 512
          description: Имя товара. Обязательно, когда своего товара ещё нет ни в запросе, ни в оффере.
        nameZh:
          type: string
          maxLength: 512
          nullable: true
        qtyMin:
          type: number
          minimum: 0
        qtyMax:
          type: number
          minimum: 0
        quantityQuestionId:
          type: string
          format: uuid
        productAttributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
        isLive:
          type: boolean
          default: false
          description: true снимает флаг с другой живой строки того же товара и того же диапазона. Строка остаётся.
        price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        contactValue:
          type: string
          maxLength: 512
          nullable: true
        contactChannel:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ContactChannel'
        contactUrl:
          type: string
          maxLength: 2048
          nullable: true
        contactAdminEntered:
          type: boolean
          description: true очищает url. Если url пустой, а контакт есть, флаг всё равно становится true.
        reasonNote:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Пусто или null при создании — срок 30 дней от текущего момента.
    UpdateOptimalCardRequest:
      type: object
      additionalProperties: false
      description: Пустые поля не меняют карточку. null в сроке снова ставит 30 дней.
      properties:
        canonicalProductId:
          type: string
          format: uuid
          nullable: true
        nameRu:
          type: string
          minLength: 1
          maxLength: 512
        nameZh:
          type: string
          maxLength: 512
          nullable: true
        qtyMin:
          type: number
          minimum: 0
        qtyMax:
          type: number
          minimum: 0
        quantityQuestionId:
          type: string
          format: uuid
        productAttributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
        isLive:
          type: boolean
        price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        contactValue:
          type: string
          maxLength: 512
          nullable: true
        contactChannel:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ContactChannel'
        contactUrl:
          type: string
          maxLength: 2048
          nullable: true
        contactAdminEntered:
          type: boolean
        reasonNote:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    ResearchDossier:
      type: object
      additionalProperties: true
      required:
        - inquiry_id
        - run_id
        - status
        - category
        - sites
        - companies
        - offers
      properties:
        inquiry_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DossierStatus'
        category:
          type: string
          description: code категории заявки
        pack:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        sites:
          type: array
          items:
            $ref: '#/components/schemas/DossierSite'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/DossierCompany'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/DossierOffer'
        fx:
          $ref: '#/components/schemas/DossierFx'
        summary_ru:
          type: string
          nullable: true
          description: Текст для админа, клиенту не отправляется
    ResearchIngestResult:
      type: object
      description: Ответ приёма досье. Цен нет.
      required:
        - research_run_id
        - inquiry_id
        - inquiry_status
        - duplicate
        - counts
        - discarded
      properties:
        research_run_id:
          type: string
          format: uuid
        inquiry_id:
          type: string
          format: uuid
        inquiry_status:
          $ref: '#/components/schemas/InquiryStatus'
        duplicate:
          type: boolean
        counts:
          $ref: '#/components/schemas/ResearchIngestCounts'
        discarded:
          type: array
          items:
            $ref: '#/components/schemas/DiscardedItem'
    LayerQuote:
      type: object
      additionalProperties: false
      required:
        - layer
        - unit
        - count
        - minRub
        - medianRub
        - fxUsed
      properties:
        layer:
          type: string
          enum:
            - FACTORY
            - CHINA_OPEN
            - RUSSIA_RETAIL
            - RUSSIA_WHOLESALE
        unit:
          type: string
        count:
          type: integer
          minimum: 1
        minRub:
          type: number
        medianRub:
          type: number
        fxUsed:
          type: string
          enum:
            - dossier
            - fallback
            - rub
    LandedUnit:
      type: object
      additionalProperties: false
      required:
        - unit
        - baseRub
        - deliveryPerUnit
        - dutyAmount
        - otherCost
        - markupAmount
        - landedRub
        - retailRub
        - deltaRub
        - verdict
        - fxUsed
      properties:
        unit:
          type: string
        baseRub:
          type: number
        deliveryPerUnit:
          type: number
        dutyAmount:
          type: number
        otherCost:
          type: number
        markupAmount:
          type: number
        landedRub:
          type: number
        retailRub:
          type: number
          nullable: true
        deltaRub:
          type: number
          nullable: true
        verdict:
          type: string
          nullable: true
          enum:
            - выгодно
            - не выгодно
            - null
        fxUsed:
          type: string
          enum:
            - dossier
            - fallback
            - rub
    DossierStatus:
      type: string
      enum:
        - complete
        - partial
        - failed
    SiteStatus:
      type: string
      enum:
        - ok
        - captcha
        - login_required
        - blocked
        - empty
        - skipped
    DossierSite:
      type: object
      additionalProperties: true
      required:
        - site
        - status
      properties:
        site:
          type: string
        status:
          $ref: '#/components/schemas/SiteStatus'
        url:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
    RegistryStatus:
      type: string
      enum:
        - active
        - revoked
        - unknown
    CompanyRole:
      type: string
      enum:
        - DIRECT_FACTORY
        - FACTORY_WITH_EXPORTER
        - TRADER
        - UNVERIFIED
        - DEALER_OR_LIST_PRICE
    DossierContactChannel:
      type: string
      enum:
        - phone
        - email
        - wechat
        - site
    DossierContact:
      type: object
      additionalProperties: true
      required:
        - channel
        - value
      properties:
        channel:
          $ref: '#/components/schemas/DossierContactChannel'
        value:
          type: string
        source_url:
          type: string
          nullable: true
    DossierCompany:
      type: object
      additionalProperties: true
      properties:
        name_cn:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        uscc:
          type: string
          nullable: true
          description: 18 символов единого социального кода или null
        registry_status:
          $ref: '#/components/schemas/RegistryStatus'
        scope:
          type: string
          nullable: true
        insured_count:
          type: integer
          nullable: true
          minimum: 0
        role:
          $ref: '#/components/schemas/CompanyRole'
        role_evidence:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/DossierContact'
    OfferCurrency:
      type: string
      enum:
        - CNY
        - USD
        - RUB
    OfferUnit:
      type: string
      enum:
        - piece
        - set
        - car
        - m
        - m2
        - t
    OfferLayer:
      type: string
      enum:
        - FACTORY
        - CHINA_OPEN
        - RUSSIA_RETAIL
        - RUSSIA_WHOLESALE
    DossierOffer:
      type: object
      additionalProperties: true
      description: |
        Оффер без source_url или без quote не отклоняет всё досье: он попадает в discarded.
      properties:
        company_ref:
          type: integer
          nullable: true
          description: Индекс в companies[] или null
        site:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        quote:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
          description: Хранится у оффера для админа. Клиенту не отдаётся.
        currency:
          $ref: '#/components/schemas/OfferCurrency'
        unit:
          $ref: '#/components/schemas/OfferUnit'
        qty_from:
          type: number
          nullable: true
        moq:
          type: number
          nullable: true
        layer:
          $ref: '#/components/schemas/OfferLayer'
        captured_at:
          type: string
          format: date-time
          nullable: true
    DossierFx:
      type: object
      additionalProperties: true
      properties:
        cny_rub:
          type: number
        usd_rub:
          type: number
        as_of:
          type: string
        source:
          type: string
    ResearchIngestCounts:
      type: object
      required:
        - companies
        - offers
        - contacts
      properties:
        companies:
          type: integer
        offers:
          type: integer
        contacts:
          type: integer
    DiscardedItem:
      type: object
      required:
        - path
        - reason
      properties:
        path:
          type: string
        reason:
          type: string
  responses:
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: Конфликт данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unprocessable:
      description: Категория досье не совпала с категорией заявки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
