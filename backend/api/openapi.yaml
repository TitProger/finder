      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/CategoryStatus'
    CreateCategoryPhraseRequest:
      type: object
      required:
        - phrase
      additionalProperties: false
      properties:
        phrase:
          type: string
          minLength: 1
    UpdateCategoryPhraseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        phrase:
          type: string
          minLength: 1
    CreateQuestionPackRequest:
      type: object
      required:
        - code
        - title
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
