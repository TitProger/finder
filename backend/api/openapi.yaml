          type: string
          format: uuid
          nullable: true
        storefrontId:
          type: string
          format: uuid
          nullable: true
        price:
          type: number
          minimum: 0
          nullable: true
        currency:
          type: string
          nullable: true
          description: Трёхбуквенный код валюты, если цена есть.
